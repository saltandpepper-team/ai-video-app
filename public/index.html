<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>✂️ AIショート動画 自動切り抜きアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>✂️ AIショート動画 自動切り抜きアプリ</h1>
    <p class="warning">
      ⚠️ 動画は500MB以下にしてください。処理には数分かかる場合があります。
    </p>

    <div class="card">
      <label for="file-input">動画ファイルを選択 (MP4など)</label>
      <input id="file-input" type="file" accept="video/mp4,video/quicktime">

      <label>切り抜きの方法を選んでください</label>
      <div class="mode-options">
        <label><input type="radio" name="mode" value="ai" checked> 🤖 AIにおまかせ</label>
        <label><input type="radio" name="mode" value="manual"> ⏱️ 手動で時間を指定</label>
      </div>

      <div id="manual-cuts-area" class="hidden">
        <label for="manual-cuts">
          切り抜きたい時間を「開始秒-終了秒」の形式で入力してください。複数ある場合はカンマ（,）で区切ります。
        </label>
        <input id="manual-cuts" type="text" placeholder="例：60-90, 343-363">
      </div>

      <button id="start-button">切り抜きを開始する</button>

      <div id="status-area" class="hidden">
        <p class="status-text" id="status-text"></p>
        <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
      </div>
    </div>

    <div id="results-card" class="card hidden">
      <h2>完成した動画</h2>
      <div id="results-list"></div>
    </div>

    <div class="card">
      <details>
        <summary>🕘 最近の切り抜き履歴</summary>
        <div id="history-list"></div>
      </details>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
