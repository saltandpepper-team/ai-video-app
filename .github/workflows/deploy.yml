name: Deploy to Firebase (pstclondrina)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: pstclondrina
  REGION: asia-northeast1             # Functions のリージョン（東京）
  FIRESTORE_LOCATION: asia-northeast1  # Firestore の場所（作成後は変更不可）
  HOSTING_SITE: pstc-londrina-ai-video # https://pstc-londrina-ai-video.web.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable required APIs
        run: |
          gcloud services enable \
            cloudfunctions.googleapis.com run.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com eventarc.googleapis.com \
            firestore.googleapis.com firebasehosting.googleapis.com \
            firebasestorage.googleapis.com identitytoolkit.googleapis.com \
            secretmanager.googleapis.com \
            --project "$PROJECT_ID"

      - name: Create Firestore database (first run only)
        run: |
          if ! gcloud firestore databases describe --database="(default)" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud firestore databases create --database="(default)" \
              --location="$FIRESTORE_LOCATION" --type=firestore-native --project "$PROJECT_ID"
          fi

      - name: Store Gemini API key in Secret Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if ! gcloud secrets describe GEMINI_API_KEY --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create GEMINI_API_KEY --replication-policy=automatic --project "$PROJECT_ID"
          fi
          CURRENT=$(gcloud secrets versions access latest --secret=GEMINI_API_KEY --project "$PROJECT_ID" 2>/dev/null || true)
          if [ "$CURRENT" != "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | gcloud secrets versions add GEMINI_API_KEY --data-file=- --project "$PROJECT_ID"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Functions virtualenv (firebase-tools が読み込むために必要)
        run: |
          cd functions
          python3.12 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Ensure Hosting site exists
        run: |
          npm install -g firebase-tools
          if ! firebase hosting:sites:get "$HOSTING_SITE" --project "$PROJECT_ID" >/dev/null 2>&1; then
            firebase hosting:sites:create "$HOSTING_SITE" --project "$PROJECT_ID"
          fi

      - name: Deploy Hosting, Functions, Firestore rules, Storage rules
        run: |
          firebase deploy --only hosting:app,functions,firestore,storage \
            --project "$PROJECT_ID" --non-interactive --force

      - name: Apply Storage CORS config (ブラウザから直接アップロードするために必要)
        run: |
          gcloud storage buckets update "gs://${PROJECT_ID}.firebasestorage.app" \
            --cors-file=storage-cors.json --project "$PROJECT_ID"
